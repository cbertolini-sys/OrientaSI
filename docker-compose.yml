services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: orientasi
      POSTGRES_USER: orientasi
      POSTGRES_PASSWORD: orientasi
    volumes:
      - dados_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U orientasi"]
      interval: 5s
      timeout: 3s
      retries: 10

  web:
    build:
      context: .
      target: dev
    command: python manage.py runserver 0.0.0.0:8000
    volumes:
      - .:/app
    ports:
      - "8000:8000"
    env_file:
      - .env
    # `config/saude.py` existe para ser consumido daqui: o endpoint abre uma
    # conexão com o banco antes de responder, então "saudável" significa
    # "Django de pé E PostgreSQL respondendo", não só "processo vivo". O curl
    # já vem instalado no estágio `base` do Dockerfile exatamente para isto.
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8000/saude/"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      # O `minio` entra no `depends_on` (spec §8.1) porque a mídia do projeto
      # (fotos, PDFs, `.docx`) é gravada nele: sem esta condição, o primeiro
      # upload numa máquina limpa pode bater num MinIO ainda subindo.
      minio:
        condition: service_healthy

  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  celery_worker:
    build:
      context: .
      target: dev
    command: celery -A config worker --loglevel=info
    volumes:
      - .:/app
    env_file:
      - .env
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      # Mesmo motivo do serviço `web`: as tarefas do worker (hoje o e-mail de
      # convite; no Bloco E, a geração de atas em PDF) gravam no bucket.
      minio:
        condition: service_healthy

  celery_beat:
    # Agendador do Celery (T10): lê `CELERY_BEAT_SCHEDULE`
    # (config/settings.py) e publica `avancar_candidaturas_vencidas` na fila
    # no horário certo — quem de fato EXECUTA a tarefa é o `celery_worker`,
    # acima. Sem `minio` no `depends_on`: ao contrário do worker, o
    # agendador nunca toca em mídia, só publica mensagens no Redis.
    build:
      context: .
      target: dev
    command: celery -A config beat --loglevel=info
    volumes:
      - .:/app
    env_file:
      - .env
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  minio:
    image: minio/minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: orientasi
      MINIO_ROOT_PASSWORD: orientasi123
    volumes:
      - dados_minio:/data
    ports:
      - "9000:9000"
      - "9001:9001"
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 3s
      retries: 10

  minio_init:
    image: minio/mc
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 orientasi orientasi123 &&
      mc mb --ignore-existing local/orientasi &&
      echo 'bucket orientasi pronto'
      "

  tailwind:
    # Sem profile: o comando oficial de subir o ambiente é `docker compose up
    # -d` (ver CLAUDE.md), e o estágio `css` do Dockerfile só alimenta o
    # estágio `prod` — o serviço `web` roda o alvo `dev`, que nunca compila
    # CSS. Colocado atrás de `profiles: [dev]`, um clone novo mais o comando
    # oficial serviria a página sem nenhum estilo (o orientasi.css está no
    # .gitignore, gerado só por este serviço ou pelo build de produção).
    image: node:22-alpine
    working_dir: /app
    command: sh -c "npm ci && npx tailwindcss -i static/css/entrada.css -o static/css/orientasi.css --watch=always"
    volumes:
      - .:/app

volumes:
  dados_postgres:
  dados_minio:
