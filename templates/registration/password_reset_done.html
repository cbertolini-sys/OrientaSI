{% extends "base.html" %}

{% block titulo %} — Verifique seu e-mail{% endblock %}

{% block conteudo %}
  <article class="mx-auto max-w-md rounded-box bg-base-100 p-6 shadow-sm">
    <h1 class="font-display text-2xl font-bold text-primary">Verifique seu e-mail</h1>
    <p class="mt-4">
      Se existir uma conta com o e-mail informado, enviamos um link para você
      escolher uma nova senha. Verifique também a caixa de spam.
    </p>
    <a href="{% url 'login' %}" class="btn btn-primary mt-6">Voltar para o login</a>
  </article>
{% endblock %}
